name: mybt-signin

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC: 18:00 UTC = 02:00 Beijing time (next day).
    - cron: "0 18 * * *"
    # 01:30 UTC = 09:30 Beijing time.
    - cron: "30 1 * * *"

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run signin
        env:
          MYBT_USERNAME: ${{ secrets.MYBT_USERNAME }}
          MYBT_PASSWORD: ${{ secrets.MYBT_PASSWORD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WX_TEST_APPID: ${{ secrets.WX_TEST_APPID }}
          WX_TEST_APP_SECRET: ${{ secrets.WX_TEST_APP_SECRET }}
          WX_TEST_TEMPLATE_ID: ${{ secrets.WX_TEST_TEMPLATE_ID }}
          WX_TEST_OPENID: ${{ secrets.WX_TEST_OPENID }}
        run: python signin.py
